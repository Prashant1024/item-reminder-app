<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <style>
.a{
	float:right;
	font-family:Roboto;
	font-size:120%;
	margin-right:24px;
	margin-top:12px;
	text-decoration:none;
	color:#2E151B;
	font-weight: bold;
}
.span{
	float:left;
	font-family:Verdana;
 	font-size:150%;
	margin-left:10px;
	margin-top:8px;
	color:#2E151B;
	font-weight: bold;

}
.button {
 	background: linear-gradient(#667eea , #764ba2);
  	border: none;
  	color: white;
	float:right;
	margin-right:35px;
  	padding: 16px 50px;
  	text-align: center;
  	text-decoration: none;
  	display: inline-block;
  	font-size: 16px;
  	cursor: pointer;
	border-radius: 5px;

}
.button:hover {
 	background: linear-gradient(#09203f , #537895);
  	border: none;
  	color: white;
	float:right;
	margin-right:35px;
  	padding: 16px 50px;
  	text-align: center;
  	text-decoration: none;
  	display: inline-block;
  	font-size: 16px;
  	cursor: pointer;
	border-radius: 5px;
}
.middle{
	border-radius: 10px;
	margin-top:5px;
	height:130px;
	width:100%;
	background: linear-gradient(70deg, #FD6585 30%, rgba(0,0,0,0) 30%), linear-gradient(30deg, #4C83FF 60%, #32CCBC 60%);
	}


.bottom {
  height: 490px;
  position: relative;
}


.last {
    position:relative;
	border-radius: 10px;
	margin-top:4px;
  	height: 50px;
	background:linear-gradient(#72EDF2,#5151E5);

}

table {

    border-radius: 8px;
    width: 60%;
}

th, td {
  text-align: left;
  padding: 25px;
  font-size: 20px;
  font-family:Verdana;
}


th {
  background: linear-gradient(#29323c ,#485563);
  color: white;
  font-size: 18px;
}
input[type="text"]{
	width:300px;
	height:30px;
}
input[type="submit"]
{
	background: linear-gradient(#667eea , #764ba2);
	margin-left:500px;
  	border: none;
  	color: white;
  	padding: 16px 50px;
  	text-align: center;
  	text-decoration: none;
  	display: inline-block;
  	font-size: 16px;
  	cursor: pointer;
	border-radius: 7px;
}
input[type="reset"]
{
	background: linear-gradient(#667eea , #764ba2);
  	border: none;
	margin-left:200px;
  	color: white;
  	padding: 16px 50px;
  	text-align: center;
  	text-decoration: none;
  	display: inline-block;
  	font-size: 16px;
  	cursor: pointer;
	border-radius: 7px;
}

input:hover[type="submit"]
{
	background: linear-gradient(#09203f , #537895);
	margin-left:500px;
  	border: none;
  	color: white;
  	padding: 16px 50px;
  	text-align: center;
  	text-decoration: none;
  	display: inline-block;
  	font-size: 16px;
  	cursor: pointer;
	border-radius: 5px;
}
input:hover[type="reset"]
{
	background: linear-gradient(#09203f , #537895);
  	border: none;
	margin-left:120px;
  	color: white;
  	padding: 16px 50px;
  	text-align: center;
  	text-decoration: none;
  	display: inline-block;
  	font-size: 16px;
  	cursor: pointer;
	border-radius: 5px;
}
    </style>
    <meta charset="UTF-8">
    <title>insert</title>
</head>
<body>
<span class="span">SPRING BOOT</span>
<a class="a" href="">Sign In</a>
<input type="button" class="button" value="Get Started">
<div class="top">
    <a th:href="@{home}" style="float:left; margin-left:80px; margin-top:12px; font-size:120%; text-decoration:none; color:#2E151B;">Home</a>
    <a th:href="@{why}" style="float:left; margin-left:50px; margin-top:12px; font-size:120%; text-decoration:none; color:#2E151B;">Why this App</a>
    <a th:href="@{aboutUs}" style="float:left; margin-left:50px; margin-top:12px; font-size:120%; text-decoration:none; color:#2E151B;">About Us</a>
    <a th:href="@{contact}" style="float:left; margin-left:50px; margin-top:12px; font-size:120%; text-decoration:none; color:#2E151B;">Contact us</a>
</div>
<br><br><br>



<div class="middle">
</div>

<div class="bottom">
    <br><br><br>
    <form action="#" th:action="@{/items}" th:object="${object}" method="post">
        <center>
            <table>
                <tr>
                    <td>Enter the Object Name </td>
                    <td><input type="text" th:field="*{objectName}" placeholder="Enter the name of the Object" required autofocus/></td>
                </tr>
                <tr>
                    <td>Enter the Hiding Place of the object </td>
                    <td><input type="text" th:field="*{hidePlace}" placeholder="Enter the place of hiding" required/></td>
                </tr>
            </table>
        </center>

        <input type="submit" value="Submit"/>
        <input type="reset" value="Reset" />


    </form>
</div>
<div class="last">
    <center><span style="font-size:80%; color:#2E151B; font-family:Comic Sans MS; margin-top:10px;">Copyright &copy; <script>document.write(new Date().getFullYear());</script>, Coding Journey</span></center>
    <span style="float:right; margin-right:8px; margin-top:-8px; font-size:120%; text-decoration:none; color:#2E151B; font-family:Comic Sans MS;">Made by : Prashant</span>
</div>
</body>
</html>
