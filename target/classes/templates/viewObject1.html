}

	background: linear-gradient(#434343, #000000);
  	border: none;
  	color: white;
  	padding: 16px 80px;

  	text-decoration: none;
  	display: inline-block;

.bottom {

	border-radius: 10px;

	background:linear-gradient(#72EDF2,#5151E5);

}

.mainbutton{
    font-family:Verdana;

  	text-decoration: none;

}

    font-family:Verdana;
	background: linear-gradient(#868f96, #596164);
  	border: none;

table {
    float:left;
    border-collapse:collapse;
    border-radius: 8px;

    padding:30px 20px;
    width: 60vw;
}

th, td {
  text-align: center;
  padding: 18px;
  font-size: 16px;
  font-family:Verdana;
}

tr:nth-child(even){background:linear-gradient(#f5f7fa , #c3cfe2);}
tr:nth-child(odd){background:linear-gradient(#a3bded ,#6991c7);}

th {
  background: linear-gradient(#29323c ,#485563);
  color: white;
  font-size: 18px;
}

#goBack{
    margin-left:600px;
}

<body>
<span class="span">SPRING BOOT</span>
<a class="a" href="">Sign In</a>
<input type="button" class="button" value="Get Started">
<div class="top">
    <a th:href="@{home}" style="float:left; margin-left:80px; margin-top:12px; font-size:120%; text-decoration:none; color:#2E151B;">Home</a>
    <a th:href="@{why}" style="float:left; margin-left:50px; margin-top:12px; font-size:120%; text-decoration:none; color:#2E151B;">Why this App</a>
    <a th:href="@{aboutUs}" style="float:left; margin-left:50px; margin-top:12px; font-size:120%; text-decoration:none; color:#2E151B;">About us</a>
    <a th:href="@{contact}" style="float:left; margin-left:50px; margin-top:12px; font-size:120%; text-decoration:none; color:#2E151B;">Contact us</a>


</div>
<br><br><br>

<div class="middle">

</div>
<div class="bottom">
    <br><br><br>
    <table>
        <tr>
            <th>Parameters</th>
            <th>Values</th>
        </tr>
        <tr>
            <td>Name of the Object is : </td><td th:text="${item.objectName}"></td>
        </tr>
        <tr>
            <td>The Object is hidden at : </td><td th:text="${item.hidePlace}"></td>
        </tr>
        <tr>
            <td>The Object ID generated is : </td><td th:text="${item.id}"></td>
        </tr>

    </table>
    <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>

    <form action="#" th:action="@{/modifyNew}" th:object="${object}" method="post">
        <input type="hidden" th:value="${item.id}" name="id"/>
        <a id = "goBack" th:href="@{viewAll}" class="mainbutton1">Go back to Object List !</a>
        <button type="submit" id="goBack2" class="mainbutton">Make Changes !</button>
    </form>
</div>


<div class="last">
